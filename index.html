<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ergon — Taejae University</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Sans+KR:wght@300;400;500;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js" defer></script>
<style>
/* Ergon for faculty. Home lists the showrooms (a carousel of what is live, then every showroom and studio).
   Every showroom, booth and piece uses one template: a poster in the showroom colour with a stage, tiles of what is inside, facts.
   A piece is the leaf, so its poster folds into a thin band and the piece itself fills the width. */
:root{
  --bg:#FFFFFF; --fg:#111111; --muted:#5E6068; --line:#E4E4E8; --tile:#F2F2EF; --warn:#8A3A0A;
  --tone:#16233F; --tone-fg:#FFFFFF; --tone-soft:rgba(255,255,255,.76); --stage:#F2C14E; --accent:#B45309;
  --sans:"Inter","Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111215; --fg:#ECECEE; --muted:#A4A6AE; --line:#2B2D33; --tile:#1C1D21; --warn:#F0A27A; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111215; --fg:#ECECEE; --muted:#A4A6AE; --line:#2B2D33; --tile:#1C1D21; --warn:#F0A27A; color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.55;word-break:keep-all;overflow-wrap:break-word}
img{max-width:100%}
a{color:inherit}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
/* full window width as on Paideia: no page max-width; side margins grow with the window, the same for the header and the page */
.gut{padding-left:max(clamp(16px,4vw,80px),env(safe-area-inset-left,0px));padding-right:max(clamp(16px,4vw,80px),env(safe-area-inset-right,0px))}
.wrap{margin:0 auto}
.brand{font-weight:600;font-size:17px;text-decoration:none}
.hostname{font-size:15px;text-decoration:none}
.hostname b{font-weight:600}
.signin{margin-left:auto;font-size:14px;text-decoration:underline;text-underline-offset:3px}
/* header, measured on Telos: 58 px sticky bar, 28 px logo, 18.5 px title and tabs, avatar + name for the account */
header.top{border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:30;padding-left:max(clamp(16px,4vw,80px),env(safe-area-inset-left,0px));padding-right:max(clamp(16px,4vw,80px),env(safe-area-inset-right,0px))}
header.top .wrap{display:flex;align-items:center;height:58px;max-width:none;gap:0}
.nav-logo{display:inline-flex;align-items:center;gap:10px;font-size:22px;font-weight:700;letter-spacing:-0.02em;margin-right:28px;white-space:nowrap;text-decoration:none}
.nav-logo .app-logo{width:34px;height:34px;flex:none;display:block}
.role-badge{font-size:10px;font-weight:600;background:#FDF0E1;color:#B45309;padding:2px 7px;border-radius:20px;letter-spacing:.04em;text-transform:uppercase}
header nav{display:flex;height:100%;overflow-x:auto;scrollbar-width:none}
header nav a{display:flex;align-items:center;padding:0 17px;font-size:18.5px;color:var(--muted);text-decoration:none;border-bottom:2px solid transparent;white-space:nowrap;transition:color .15s}
header nav a:hover{color:var(--fg)}
header nav a[aria-current="page"]{color:#B45309;border-bottom-color:#B45309;font-weight:500}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.me{position:relative}
.me>button{display:flex;align-items:center;gap:7px;padding:4px 6px;border:none;border-radius:8px;background:transparent}
.me>button:hover{background:var(--tile)}
.nav-avatar{width:32px;height:32px;border-radius:50%;background:#FDF0E1;color:#B45309;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.nav-name{font-size:18.5px;color:var(--fg);max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
.menu .who{display:block;padding:12px 14px 10px;border-bottom:1px solid var(--line);max-width:300px}
.menu .who span{display:block;font-size:15px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu .who b{display:block;font-size:17px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me .caret{font-size:10px;color:var(--muted)}
.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:40;min-width:170px;padding:0;background:var(--bg);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.menu .who{display:block;padding:10px 14px 8px;border-bottom:1px solid var(--line);font-size:17px;font-weight:500}
.menu .who small{display:block;font-size:17px;font-weight:400;color:var(--muted)}
.menu button{display:flex;align-items:center;gap:9px;width:100%;padding:9px 14px;border:none;background:transparent;text-align:left;font-size:17px}
.menu button:hover{background:var(--tile)}
.menu button[data-act="out"]{color:#C0392B}
.menu .div{display:block;height:1px;background:var(--line);margin:3px 0}
.lbl{font-size:12px;letter-spacing:.04em;color:var(--muted)}
h1{margin:0;font-weight:300;letter-spacing:-.02em;line-height:1.08;text-wrap:balance}
h2{margin:0;font-weight:500;font-size:15px}
.chip{display:inline-block;padding:3px 9px;font-size:12px;font-weight:600;color:#111111}
/* sign-in (same flow as TaeSylla and Telos) */
.wall{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:var(--bg)}
.wall[hidden]{display:none}
.wcard{width:100%;max-width:420px;margin:0 16px;box-shadow:0 0 0 1px var(--line)}
.wcard .wh{padding:32px 32px 20px;border-bottom:1px solid var(--line)}
.wcard .wh .brand{display:block;margin-bottom:18px}
.wcard .wh h2{font-weight:300;font-size:28px;letter-spacing:-.01em}
.wcard .wh p{margin:6px 0 0;color:var(--muted)}
.wcard form{padding:24px 32px 32px;display:flex;flex-direction:column;gap:14px}
.wcard label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.wcard input{min-height:46px;padding:0 12px;border:1px solid var(--line);background:var(--bg);font-size:16px}
.wcard .err{min-height:20px;font-size:14px;color:var(--warn)}
.wcard button[type=submit]{min-height:46px;border:none;background:var(--fg);color:var(--bg);font-size:15px;font-weight:500}
.wcard button[type=submit]:disabled{opacity:.6;cursor:default}
.wcard .alt{font-size:13px;color:var(--muted)}
/* home: the carousel of live showrooms. The centre card is in front; its neighbours sit dimmed behind it,
   and the strip of each that shows in the side gutter carries a compact label. Hovering a gutter moves the deck. */
.deck{--W:min(1040px,72vw);position:relative;height:clamp(440px,52vw,580px);margin-top:28px;overflow:hidden;touch-action:pan-y;outline:none}
.card{position:absolute;top:0;bottom:0;left:50%;width:var(--W);margin-left:calc(var(--W) / -2);display:flex;flex-wrap:wrap;color:#FFFFFF;overflow:hidden;
  transition:transform 750ms cubic-bezier(.22,.8,.2,1),filter 600ms ease,opacity 600ms ease;will-change:transform}
.card.c0{z-index:3;transform:none;filter:none}
.card.cl,.card.cr{z-index:2;filter:brightness(.42) saturate(.75)}
.card.cl{transform:translateX(-92%) scale(.8)}
.card.cr{transform:translateX(92%) scale(.8)}
.card.cfl,.card.cfr{z-index:1;opacity:0;filter:brightness(.3)}
.card.cfl{transform:translateX(-170%) scale(.7)}
.card.cfr{transform:translateX(170%) scale(.7)}
.card:not(.c0) .ci,.card:not(.c0) .cs{visibility:hidden}
.card .ci{flex:1 1 300px;min-width:0;padding:36px;box-sizing:border-box;display:flex;flex-direction:column}
.card .cs{flex:1 1 380px;min-width:0;padding:36px 36px 36px 0;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;gap:12px}
.card .ctx{margin-top:24px;font-size:15px;font-weight:500;opacity:.9}
.card h1{margin-top:8px;font-size:clamp(28px,3.4vw,48px)}
.card .meta{margin-top:14px;opacity:.85}
.card .enter{margin-top:auto;align-self:flex-start;padding:24px 0 3px;border-bottom:1px solid #FFFFFF;text-decoration:none;font-size:15px}
.card.c0 .ci>*{animation:rise 600ms cubic-bezier(.22,.8,.2,1) both}
.card.c0 .ci>*:nth-child(2){animation-delay:60ms}.card.c0 .ci>*:nth-child(3){animation-delay:110ms}.card.c0 .ci>*:nth-child(4){animation-delay:160ms}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.peek{position:absolute;top:0;bottom:0;z-index:4;width:calc((100% - var(--W)) / 2 - 8px);border:none;background:transparent;padding:0 14px;display:flex;flex-direction:column;justify-content:center;gap:6px;color:#FFFFFF;text-align:left;font-size:14px;line-height:1.3}
.peek.l{left:0;align-items:flex-end;text-align:right}
.peek.r{right:0;align-items:flex-start}
.peek .chip{font-size:11px}
.peek b{font-weight:400;font-size:clamp(14px,1.3vw,18px);max-width:14em}
.peek small{opacity:.75}
.peek .arw{opacity:0;transition:opacity 200ms ease,transform 200ms ease}
.peek:hover .arw,.peek:focus-visible .arw{opacity:1}
.peek.l:hover .arw{transform:translateX(-4px)}.peek.r:hover .arw{transform:translateX(4px)}
.peek .bar{display:block;width:44px;height:2px;background:rgba(255,255,255,.35);overflow:hidden}
.peek .bar i{display:block;height:100%;width:0;background:#FFFFFF}
.peek.arming .bar i{width:100%;transition:width var(--dwell,450ms) linear}
.dots{display:flex;justify-content:center;gap:4px;padding-top:12px}
.dots button{width:36px;height:32px;border:none;background:transparent;padding:0;display:flex;align-items:center}
.dots span{display:block;width:100%;height:2px;background:var(--line);overflow:hidden}
.dots span i{display:block;height:100%;width:0;background:var(--fg)}
.dots button[aria-current="true"] span i{width:100%;transition:width var(--auto,8000ms) linear}
.deck.paused~.dots button[aria-current="true"] span i{width:100%;transition:none}
@media (max-width:700px){.deck{--W:86vw}.card .cs{padding:0 24px 24px}.card .ci{padding:24px}.peek b,.peek small,.peek .chip{display:none}}
@media (prefers-reduced-motion: reduce){.card{transition:none}.card.c0 .ci>*{animation:none}}
/* poster */
.poster{background:var(--tone);color:var(--tone-fg)}
.poster .wrap{padding-block:12px 44px}
.crumb{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;min-height:44px;font-size:14px;color:var(--tone-soft)}
.crumb .path{display:flex;flex-wrap:wrap;align-items:center;gap:0 8px;min-width:0}
.crumb .path a{display:inline-flex;align-items:center;gap:6px;min-height:44px;text-decoration:none;color:var(--tone-fg)}
.crumb .path .sep{opacity:.6}
.crumb .sib{margin-left:auto;display:flex;align-items:center;gap:6px}
.crumb .sib a{display:inline-flex;align-items:center;min-height:44px;padding:0 6px;text-decoration:none;color:var(--tone-fg)}
.pgrid{display:flex;flex-wrap:wrap;align-items:center;gap:32px 56px;margin-top:14px}
.id{flex:1 1 340px;min-width:0;display:flex;flex-direction:column}
.state{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--tone-soft)}
.id .ctx{margin-top:24px;font-size:clamp(15px,1.3vw,19px);font-weight:500;line-height:1.35}
.id h1{margin-top:8px;font-size:clamp(32px,3.8vw,56px)}
.prog{margin-top:14px;color:var(--tone-soft);max-width:56ch;white-space:pre-line}
.idl{margin:22px 0 0;display:grid;grid-template-columns:84px 1fr;gap:6px 14px;font-size:14px}
.idl dt{color:var(--tone-soft)} .idl dd{margin:0}
.stage{flex:1 1 520px;max-width:720px;min-width:0}
.shot{display:block;position:relative;width:100%;aspect-ratio:16/9;background:rgba(0,0,0,.25);overflow:hidden;text-decoration:none}
.shot img{display:block;width:100%;height:100%;object-fit:cover;animation:fade 600ms ease}
.ph{display:flex;flex-direction:column;justify-content:flex-end;gap:6px;width:100%;height:100%;box-sizing:border-box;padding:7%;background:rgba(255,255,255,.08);color:#FFFFFF;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.ph small{font-size:.8em;opacity:.8;letter-spacing:.04em}
.ph b{font-weight:300;font-size:1.5em;line-height:1.15}
.cap{display:flex;justify-content:space-between;gap:12px;margin-top:12px;font-size:14px}
.cap b{font-weight:600}
.cap span:last-child{opacity:.75;font-variant-numeric:tabular-nums}
.play{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center}
.sess{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));column-gap:20px;margin-top:36px;border-top:1px solid rgba(255,255,255,.28)}
.sess div{padding:12px 8px 0 0;margin-top:-1px;border-top:2px solid transparent;font-size:14px;color:var(--tone-soft)}
.sess div.on{border-top-color:#FFFFFF;color:#FFFFFF;font-weight:600}
.sess small{display:block;font-weight:400;font-size:12px;opacity:.85}
@keyframes fade{from{opacity:0}to{opacity:1}}
/* piece: a thin band and the piece across the full width */
.band .wrap{padding-block:4px 16px}
.brow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px}
.brow .bt{min-width:0;flex:1 1 320px;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 12px}
.brow .ctx{font-size:14px;font-weight:500;color:var(--tone-soft)}
.brow h1{font-size:clamp(20px,2.1vw,28px)}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.acts a{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;text-decoration:none;font-size:14px}
.acts a.go{background:#FFFFFF;color:#111111;font-weight:600}
.acts a.src{color:var(--tone-fg);text-decoration:underline;text-underline-offset:3px;padding:0 4px}
.full{background:#0B1220}
.full iframe{display:block;width:100%;max-width:calc((100vh - 140px) * 16 / 9);aspect-ratio:16/9;margin:0 auto;border:0;background:#0B1220}
/* tiles and facts */
.sec{padding-block:56px 0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-bottom:12px;margin-bottom:24px;border-bottom:1px solid var(--fg)}
/* every list uses one template: four cards a row, two on tablets, one on phones */
.tiles,.tiles.wide{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:40px 28px}
@media (max-width:1100px){.tiles,.tiles.wide{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.tiles,.tiles.wide{grid-template-columns:1fr}}
.tile{display:block;text-decoration:none}
.tile .minis{display:grid;gap:6px;padding:14px;box-sizing:border-box;aspect-ratio:16/9;max-width:100%;background:var(--tile)}
/* every booth and studio tile has the same 16:9 preview; inside it, one piece fills it, two split it, three or more give one large and two small */
.tile .minis.m1{grid-template:1fr/1fr}
.tile .minis.m2{grid-template:1fr/1fr 1fr}
.tile .minis.m3{grid-template:1fr 1fr/2fr 1fr}
.tile .minis.m3>:first-child{grid-row:1/3}
.tile .minis .cell{position:relative;min-width:0;min-height:0;overflow:hidden;box-shadow:0 0 0 1px var(--line);background:var(--bg)}
.tile .minis .cell img,.tile .minis .cell .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;font-size:8px;color:var(--muted);background:var(--tile);box-shadow:none}
.tile .minis .more{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(17,17,17,.55);color:#FFFFFF;font-size:18px;font-weight:500}
.tile .one{position:relative;display:block;background:var(--tile);padding:14px}
.tile .one img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;box-shadow:0 0 0 1px var(--line)}
.tile .one .play{width:44px;height:44px;margin:-22px 0 0 -22px}
.tile .row{display:flex;justify-content:space-between;gap:8px;margin-top:12px;font-size:12px;color:var(--muted)}
.tile .t{display:block;margin-top:4px;font-size:17px;font-weight:500;line-height:1.3}
.tile .s{display:block;margin-top:6px;font-size:13px;color:var(--muted)}
a.tile:hover .t{text-decoration:underline;text-underline-offset:3px}
.rtile{display:flex;flex-direction:column;aspect-ratio:16/9;padding:22px;box-sizing:border-box;color:#FFFFFF;text-decoration:none}
.rtile .rs{margin-top:auto;font-size:13px;opacity:.85}
.rtile .rn{margin-top:6px;font-weight:300;font-size:26px;line-height:1.1;letter-spacing:-.01em}
.rtile .rm{margin-top:10px;font-size:13px;opacity:.9}
.newtile{display:flex;align-items:center;justify-content:center;aspect-ratio:16/9;box-shadow:inset 0 0 0 1px var(--line);font-weight:300;font-size:32px;color:var(--muted)}
.lbar{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;padding-top:32px}
.lrole{min-height:40px;padding:0 16px;font-size:14px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.lrole.on{background:var(--accent);border-color:var(--accent);color:#FFFFFF}
.under{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-top:12px;font-size:14px;color:var(--muted)}
.under b{font-weight:500;color:var(--fg)}
.under .hadd{min-height:0;font-size:13px}
.addtile{display:flex;align-items:center;justify-content:center;width:100%;aspect-ratio:16/9;border:none;background:transparent;box-shadow:inset 0 0 0 1px var(--line);font-weight:300;font-size:34px;color:var(--muted)}
.greet{margin:0;padding-top:28px}
.greet-h{font-size:clamp(28px,2.6vw,36px);font-weight:600;letter-spacing:-0.01em;line-height:1.2}
.greet-s{margin-top:6px;font-size:18px;color:var(--muted)}
.etile{position:relative}
.tile.tbtn{width:100%;padding:0;border:none;background:none;text-align:left;font:inherit;color:inherit;cursor:pointer}
.tile.tbtn:hover .t{text-decoration:underline}
.etile.gone>:first-child{opacity:.4}
.etile .back{position:absolute;top:8px;right:8px;min-height:34px;padding:0 12px;border:none;background:#111111;color:#FFFFFF;font-size:13px}
.lbar{align-items:center}
.lbar .lleft{margin-right:auto}
.lbar .lroles{display:flex;flex-wrap:wrap;gap:6px}
.hadd.edit{font-weight:500}
.etile .ex,.pedit>.ex{position:absolute;top:8px;right:8px;width:34px;height:34px;border:none;border-radius:50%;background:rgba(17,17,17,.78);color:#FFFFFF;font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center}
.etile .ex:hover,.pedit>.ex:hover{background:#8A3A0A}
.addtile.pt{flex-direction:column;gap:6px;aspect-ratio:16/9;align-self:start}
.addtile.pt small{font-size:13px}
.addcard{display:flex;flex-direction:column;gap:10px;padding:16px;box-shadow:inset 0 0 0 1px var(--line);align-self:start}
.addcard label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.addcard input{min-height:40px;padding:0 10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;font-size:15px}
.addcard .am{margin:0;min-height:18px;font-size:13px;color:var(--warn)}
.addcard .ab{display:flex;justify-content:flex-end;gap:8px}
.addcard .ab button{min-height:40px;padding:0 16px;border:1px solid var(--line);background:var(--bg);font-size:14px}
/* a piece being edited: thumbnail and form are one card, and its x removes the whole card */
.pedit{position:relative;align-self:start;background:var(--tile)}
.pedit .addcard{box-shadow:none;padding-top:4px}
.pedit.gone>:first-child{opacity:.4}
.pedit>.back{position:absolute;top:8px;right:8px;min-height:34px;padding:0 12px;border:none;background:#111111;color:#FFFFFF;font-size:13px}
.addcard .ab .go{border:none;background:var(--accent);color:#FFFFFF;font-weight:500}
.empty{padding:28px 0;color:var(--muted)}
.gatebtn{min-height:46px;padding:0 20px;border:none;background:#FFFFFF;color:#111111;font-size:15px;font-weight:500}
.hadd{min-height:36px;padding:0 4px;border:none;background:transparent;font-size:14px;color:var(--fg);text-decoration:underline;text-underline-offset:3px}
.group{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:28px 0 16px}
.group b{font-size:18px;font-weight:500}
.facts{display:grid;grid-template-columns:minmax(110px,190px) 1fr;gap:14px 24px;max-width:900px;margin:0}
.facts dt{color:var(--muted)} .facts dd{margin:0}
@media (max-width:640px){.facts{grid-template-columns:1fr;gap:2px}.facts dd{margin-bottom:12px}}
.foot{padding-block:48px 72px;color:var(--muted);font-size:13px}
/* invite: the host's one-click kit for a showroom (link, QR, invitation card) */
.ibtn{margin-left:auto;min-height:36px;padding:0 14px;border:1px solid rgba(255,255,255,.6);background:transparent;color:var(--tone-fg);font-size:13px}
.crumb .sib+.ibtn{margin-left:12px}
dialog.inv{width:min(560px,calc(100vw - 32px));padding:0;border:none;background:var(--bg);color:var(--fg);box-shadow:0 0 0 1px var(--line),0 20px 60px rgba(0,0,0,.25)}
dialog.inv::backdrop{background:rgba(10,12,18,.55)}
.inv .ih{padding:22px 24px 16px;color:#FFFFFF}
.inv .ih h2{font-weight:300;font-size:24px;margin-top:6px}
.inv .ib{padding:20px 24px 24px;display:flex;flex-direction:column;gap:16px}
.inv .row{display:flex;gap:8px}
.inv input{flex:1;min-width:0;min-height:42px;padding:0 10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:14px}
.inv .qr{display:flex;align-items:center;gap:18px}
.inv .qr canvas{width:132px;height:132px;flex:none;box-shadow:0 0 0 1px var(--line);background:#FFFFFF}
.inv .qr p{margin:0;color:var(--muted);font-size:14px}
.inv .btns{display:flex;flex-wrap:wrap;gap:8px}
.inv .aud{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.inv .aud label{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border:1px solid var(--line);cursor:pointer;font-size:14px;font-weight:500}
.inv .aud label:has(input:checked){border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.inv .aud input{position:absolute;opacity:0;pointer-events:none}
.inv .aud label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.inv .aud small{font-weight:400;font-size:12px;color:var(--muted)}
@media (max-width:520px){.inv .aud{grid-template-columns:1fr}}
.inv button{min-height:42px;padding:0 16px;border:1px solid var(--fg);background:var(--bg);font-size:14px}
.inv button.pri{background:var(--fg);color:var(--bg)}
.inv .x{position:absolute;top:10px;right:10px;width:40px;height:40px;min-height:0;padding:0;border:none;background:transparent;color:#FFFFFF;font-size:20px}
/* teams and booths: the host drags the class into teams */
.ibtn+.ibtn{margin-left:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
dialog.tm{width:min(1200px,calc(100vw - 32px))}
dialog.tm .tm-body{display:flex;flex-wrap:wrap;min-height:420px;max-height:calc(100vh - 260px);overflow:auto}
dialog.tm .tm-left{flex:0 0 250px;max-width:100%;display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--tile)}
dialog.tm .tm-right{flex:1 1 560px;min-width:0;padding:14px}
dialog.tm .tm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
dialog.tm .tm-team{display:flex;flex-direction:column;box-shadow:0 0 0 1px var(--line)}
dialog.tm .tm-h{display:flex;align-items:baseline;gap:8px;padding:10px 12px 6px;font-size:13px}
dialog.tm .tm-h span{color:var(--muted)}
dialog.tm .tm-zone{display:flex;flex-direction:column;gap:6px;min-height:96px;padding:8px 10px 10px;flex:1}
dialog.tm .tm-zone.hot,dialog.tm .tm-new.hot{background:var(--tile);box-shadow:inset 0 0 0 2px var(--fg)}
dialog.tm .tm-card{display:flex;flex-direction:column;align-items:flex-start;gap:1px;width:100%;min-height:48px;padding:7px 11px;border:none;background:var(--bg);color:var(--fg);box-shadow:0 0 0 1px var(--line);text-align:left;cursor:grab;font:inherit}
dialog.tm .tm-card b{font-size:14px;font-weight:500}
dialog.tm .tm-card small{font-size:12px;color:var(--muted)}
dialog.tm .tm-card.on{box-shadow:0 0 0 2px var(--fg)}
dialog.tm .tm-title{display:block;padding:0 12px 6px}
dialog.tm .tm-title input{width:100%;box-sizing:border-box;min-height:34px;padding:0 8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:13px}
dialog.tm .tm-new{min-height:200px;border:none;background:transparent;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:14px}
dialog.tm .tm-new span:first-child{font-size:28px;font-weight:300}
dialog.tm .tm-rm{margin-left:auto;min-height:28px;padding:0 4px;border:none;background:transparent;color:var(--muted);font-size:12px;text-decoration:underline}
dialog.tm .tm-foot{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:14px 24px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
dialog.tm .tm-btns{margin-left:auto;display:flex;gap:8px}
dialog.tm .tm-load,dialog.tm .tm-done{margin:0;padding:24px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;padding:10px 16px;background:var(--fg);color:var(--bg);font-size:14px}
.toast[hidden]{display:none}
@media (prefers-reduced-motion: reduce){.shot img{animation:none}.card{transition:none}}

/* logo and title as on Paideia: Marcellus 25 px with a 16 px keyword after a middle dot */

  }
  app.addEventListener('click', function(e){ var t = e.target.closest('[data-invite]'); if (t) openInvite(t.getAttribute('data-invite')); });
  $('inv').addEventListener('click', function(e){
    if (e.target === $('inv')) { $('inv').close(); return; }
    var t = e.target.closest('[data-inv]'); if (!t || !invRoom) return;
    var act = t.getAttribute('data-inv'), slug = invRoom.key;
    if (act === 'close') $('inv').close();
    if (act === 'copy') {
      var done = function(){ toast('Link copied'); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText($('inv-link').value).then(done, function(){ $('inv-link').select(); });
      else { $('inv-link').select(); }
    }
    if (act === 'qr') { var q = qrModules(inviteURL(invRoom)); if (!q) return; var cv = document.createElement('canvas'); cv.width = cv.height = 1024; drawQR(cv.getContext('2d'), q, 0, 0, 1024); saveCanvas(cv, 'ergon-' + slug + '-qr.png'); }
    if (act === 'card') { var go = function(){ saveCanvas(invitationCard(invRoom), 'ergon-' + slug + '-invitation.png'); }; if (document.fonts && document.fonts.load) Promise.all([document.fonts.load('300 104px "Noto Sans KR"'), document.fonts.load('500 44px "Noto Sans KR"')]).then(go, go); else go(); }
  });

  // ── TEAMS AND BOOTHS: the host drags the class into teams; each team gets a booth and a studio ──
  var tm = { room: null, roster: [], teams: [], sel: null };
  function openTeams(key){
    var f = find('s', key); if (!f || !f.room.db || roleIn(f.room) !== 'host') return;
    tm.room = f.room; tm.sel = null; tm.roster = [];
    tm.teams = f.room.booths.map(function(b){ return { booth_id: b.boothId, title: b.name, emails: b.exhibitorEmails.slice() }; });
    $('tm-ctx').textContent = f.room.ctx ? f.room.ctx + ' · ' + f.room.name : f.room.name;
    $('tm-head').style.background = f.room.tone;
    $('tm-body').innerHTML = '<p class="tm-load">Loading the class…</p>'; $('tm-status').textContent = ''; $('tm-save').disabled = true;
    $('tm').showModal();
    rpc('ergon_class_roster', { p_showroom_id: f.room.showroomId })
      .then(function(rows){ tm.roster = rows || []; $('tm-save').disabled = false; drawTeams(); })
      .catch(function(ex){ $('tm-body').innerHTML = '<p class="tm-load">' + esc(ex.message) + '</p>'; });
  }
  function drawTeams(){
    var by = {}, placed = {};
    tm.roster.forEach(function(s){ by[s.email] = s; });
    tm.teams.forEach(function(t){ t.emails.forEach(function(e){ placed[e] = true; }); });
    var card = function(e){
      var s = by[e] || { name_en: e.split('@')[0], student_no: '', signed_up: true };
      return '<button type="button" class="tm-card' + (tm.sel === e ? ' on' : '') + '" draggable="true" data-email="' + esc(e) + '" aria-pressed="' + (tm.sel === e) + '"><b>' + esc(s.name_en) + '</b><small>' + esc(s.student_no || '') + (s.signed_up ? '' : ' · no sign-in yet') + '</small></button>';
    };
    var left = tm.roster.filter(function(s){ return !placed[s.email]; });
    var h = '<div class="tm-left"><div class="tm-h"><b>Students</b><span>' + left.length + ' not on a team</span></div><div class="tm-zone" data-zone="left">' +
      left.map(function(s){ return card(s.email); }).join('') + (left.length ? '' : '<p class="tm-done">Everyone is on a team</p>') + '</div></div><div class="tm-right"><div class="tm-grid">';
    tm.teams.forEach(function(t, i){
      h += '<div class="tm-team"><div class="tm-h"><b>Team ' + (i + 1) + '</b><span>' + plural(t.emails.length, 'student') + '</span>' +
        (t.emails.length ? '' : '<button type="button" class="tm-rm" data-rm="' + i + '">Remove</button>') + '</div>' +
        '<label class="tm-title"><span class="sr">Project title for Team ' + (i + 1) + '</span><input type="text" data-title="' + i + '" placeholder="Project title" value="' + esc(t.title) + '"></label>' +
        '<div class="tm-zone" data-zone="' + i + '">' + t.emails.map(card).join('') + '</div></div>';
    });
    h += '<button type="button" class="tm-new" data-zone="new"><span aria-hidden="true">+</span><span>' +
      (tm.sel ? 'New team with ' + esc((by[tm.sel] || {}).name_en || tm.sel) : 'Drop a student here to start a team') + '</span></button></div></div>';
    $('tm-body').innerHTML = h;
    var n = tm.roster.length - left.length;
    $('tm-status').textContent = n + ' of ' + tm.roster.length + ' students on ' + plural(tm.teams.length, 'team') + ' · each team gets a booth and a studio';
    $('tm-save').textContent = 'Save ' + plural(tm.teams.length, 'team');
  }
  function moveTo(email, zone){
    if (email) tm.teams.forEach(function(t){ t.emails = t.emails.filter(function(e){ return e !== email; }); });
    if (zone === 'new') tm.teams.push({ booth_id: null, title: '', emails: email ? [email] : [] });
    else if (email && zone !== 'left' && tm.teams[+zone]) tm.teams[+zone].emails.push(email);
    tm.sel = null; drawTeams();
  }
  app.addEventListener('click', function(e){ var t = e.target.closest('[data-teams]'); if (t) openTeams(t.getAttribute('data-teams')); });
  var tmd = $('tm');
  tmd.addEventListener('dragstart', function(e){ var c = e.target.closest && e.target.closest('.tm-card'); if (c && e.dataTransfer) { e.dataTransfer.setData('text/plain', c.getAttribute('data-email')); e.dataTransfer.effectAllowed = 'move'; } });
  tmd.addEventListener('dragover', function(e){ var z = e.target.closest('[data-zone]'); if (!z) return; e.preventDefault(); if (e.dataTransfer) e.dataTransfer.dropEffect = 'move'; z.classList.add('hot'); });
  tmd.addEventListener('dragleave', function(e){ var z = e.target.closest('[data-zone]'); if (z && !z.contains(e.relatedTarget)) z.classList.remove('hot'); });
  tmd.addEventListener('drop', function(e){ var z = e.target.closest('[data-zone]'); if (!z) return; e.preventDefault(); var em = e.dataTransfer && e.dataTransfer.getData('text/plain'); if (em) moveTo(em, z.getAttribute('data-zone')); });
  tmd.addEventListener('input', function(e){ var i = e.target.getAttribute && e.target.getAttribute('data-title'); if (i != null && tm.teams[+i]) tm.teams[+i].title = e.target.value; });
  tmd.addEventListener('click', function(e){
    if (e.target === tmd) { tmd.close(); return; }
    var b = e.target.closest('[data-tm]');
    if (b && b.getAttribute('data-tm') === 'close') { tmd.close(); return; }
    if (b && b.getAttribute('data-tm') === 'save') {
      b.disabled = true; b.textContent = 'Saving…';
      rpc('ergon_assign_teams', { p_showroom_id: tm.room.showroomId, p_teams: tm.teams.map(function(t){ return { booth_id: t.booth_id, title: t.title, emails: t.emails }; }) })
        .then(function(){ tmd.close(); toast('Teams saved'); return loadDB(); }).then(render)
        .catch(function(ex){ toast(ex.message); b.disabled = false; drawTeams(); });
      return;
    }
    var rm = e.target.closest('[data-rm]'); if (rm) { tm.teams.splice(+rm.getAttribute('data-rm'), 1); drawTeams(); return; }
    var c = e.target.closest('.tm-card'); if (c) { var em = c.getAttribute('data-email'); tm.sel = tm.sel === em ? null : em; drawTeams(); return; }
    var z = e.target.closest('[data-zone]'); if (!z) return;
    var zone = z.getAttribute('data-zone');
    if (zone === 'new') moveTo(tm.sel, 'new');
    else if (tm.sel) moveTo(tm.sel, zone);
  });

  // ── SESSION (same as Telos and TaeSylla) ──
  // sessionStorage, not localStorage: a refresh keeps you signed in, closing the tab does not.
  // Paideia: the suite apps share this origin, so each also keeps the session under one shared key.
  // Signing in once (on the Paideia page or in any app) carries over to the others in the same tab,
  // and signing out of one signs out of all of them.
  var SUITE_KEY = 'paideia_session';
  var SUITE_KEYS = ['paideia_session', 'telos_faculty_session', 'telos_student_session', 'taesylla_session', 'ergon_session', 'paideia_gcal'];
  // Tabs opened from Paideia start with a copy of one session. Supabase rotates the refresh token on every renewal,
  // so a tab hands each renewed session to the other suite tabs (same origin), and takes a newer one for the same
  // person from them. Without this, the next tab to renew would be refused and the session revoked.
  var SUITE_CH = 'BroadcastChannel' in window ? new BroadcastChannel('paideia_suite') : null;
  function saveSession(quiet){
    try { var v = JSON.stringify(sbUser); sessionStorage.setItem(SESSION_KEY, v); sessionStorage.setItem(SUITE_KEY, v); } catch (e) {}
    if (!quiet && SUITE_CH && sbUser) SUITE_CH.postMessage({ session: sbUser });
  }
  if (SUITE_CH) SUITE_CH.onmessage = function(e){
    var s = e.data && e.data.session, me = sbUser && sbUser.user && sbUser.user.email;
    if (!s || !s.access_token || !me || !s.user || s.user.email !== me || (s.expires_at || 0) <= (sbUser.expires_at || 0)) return;
    sbUser = s; saveSession(true);
  };
  function clearSession(){ try { SUITE_KEYS.forEach(function(k){ sessionStorage.removeItem(k); }); } catch (e) {} }
  // The newer of this app's own session and the shared one: a token renewed in another app wins.
  function newestSession(){
    return [SESSION_KEY, SUITE_KEY].map(function(k){ try { return JSON.parse(sessionStorage.getItem(k) || 'null'); } catch (e) { return null; } })
      .filter(function(x){ return x && x.access_token; }).sort(function(a, b){ return (b.expires_at || 0) - (a.expires_at || 0); })[0] || null;
  }
  // Access tokens last about an hour: renew with the refresh token when one is nearly out.
  var refreshing = null;
  function sbFresh(){
    var u = sbUser;
    if (!u || !u.access_token) return Promise.resolve(false);
    if (u.expires_at && u.expires_at * 1000 - Date.now() > 60000) return Promise.resolve(true);
    if (!u.refresh_token) return Promise.resolve(false);
    if (!refreshing) refreshing = fetch(SUPABASE_URL + '/auth/v1/token?grant_type=refresh_token', { method: 'POST', headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ refresh_token: u.refresh_token }) })
      .then(function(r){ if (!r.ok) throw new Error('refresh failed'); return r.json(); })
      .then(function(j){ sbUser = j; saveSession(); return true; })
      .catch(function(){ return false; })
      .then(function(ok){ refreshing = null; return ok; });
    return refreshing;
  }
  function authHeaders(){ return { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + sbUser.access_token, 'Content-Type': 'application/json' }; }
  function showWall(on){ $('login-wall').hidden = !on; $('wall-cancel').hidden = !(on && /^#?s\//.test(location.hash)); if (on) setTimeout(function(){ $('wall-email').focus(); }, 0); }
  $('wall-cancel').addEventListener('click', function(){ showWall(false); });
  function toast(msg){ var t = $('toast'); t.textContent = msg; t.hidden = false; setTimeout(function(){ t.hidden = true; }, 2500); }

  // After sign-in, or after a refresh that restored the session: the faculty profile, if there is one, gives the name and the first-sign-in password step
  function enterApp(email){
    var authEmail = String((sbUser.user && sbUser.user.email) || email).trim().toLowerCase();
    return fetch(SUPABASE_URL + '/rest/v1/faculty_profiles?email=eq.' + encodeURIComponent(authEmail) + '&select=name_en,email,program,must_change_password', { headers: authHeaders() })
      .then(function(r){ return r.ok ? r.json() : []; }).catch(function(){ return []; })
      .then(function(rows){
        var p = Array.isArray(rows) && rows[0];
        PROFESSOR = { name: (p && p.name_en) || (sbUser.user && sbUser.user.user_metadata && sbUser.user.user_metadata.full_name) || authEmail.split('@')[0], email: authEmail, isFaculty: !!p };
        return sha256(authEmail).then(function(h){ PROFESSOR.id = h; }, function(){}).then(loadDB).then(function(){
        render();
        if (p && p.must_change_password === true) showPwWall('first');
        });
      });
  }
  $('login-form').addEventListener('submit', function(e){
    e.preventDefault();
    var email = $('wall-email').value.trim(), password = $('wall-password').value, err = $('wall-error'), btn = $('wall-submit');
    if (loginLocked) return;
    if (!email || !password) { err.textContent = 'Email and password are required.'; return; }
    if (!/@taejae\.ac\.kr$/i.test(email)) { err.textContent = 'Please use your @taejae.ac.kr institutional email.'; return; }
    btn.textContent = 'Signing in…'; btn.disabled = true; err.textContent = '';
    fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', { method: 'POST', headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ email: email, password: password }) })
      .then(function(r){ return r.json().then(function(data){ if (!r.ok) throw new Error(data.error_description || data.msg || 'Sign-in failed'); return data; }); })
      .then(function(data){ sbUser = data; saveSession(); loginAttempts = 0; $('wall-password').value = ''; btn.textContent = 'Sign in'; btn.disabled = false; return enterApp(email); })
      .catch(function(ex){
        loginAttempts++;
        if (loginAttempts >= 5) {
          loginLocked = true; err.textContent = 'Too many failed attempts. Please wait 30 seconds.'; btn.disabled = true;
          setTimeout(function(){ loginAttempts = 0; loginLocked = false; btn.disabled = false; btn.textContent = 'Sign in'; err.textContent = ''; }, 30000);
        } else { err.textContent = ex.message; btn.textContent = 'Sign in'; btn.disabled = false; }
      });
  });
  function showPwWall(mode){
    $('pw-wall').dataset.mode = mode;
    $('pw-title').textContent = mode === 'first' ? 'Set your password' : 'Change password';
    $('pw-desc').textContent = mode === 'first' ? 'This is your first sign-in. Please set a new password to continue.' : 'Enter your new password below.';
    $('pw-submit').textContent = mode === 'first' ? 'Set password & continue' : 'Update password';
    $('pw-new').value = ''; $('pw-confirm').value = ''; $('pw-error').textContent = '';
    $('pw-wall').hidden = false; $('pw-new').focus();
  }
  $('pw-form').addEventListener('submit', function(e){
    e.preventDefault();
    var p1 = $('pw-new').value, p2 = $('pw-confirm').value, err = $('pw-error'), btn = $('pw-submit'), mode = $('pw-wall').dataset.mode;
    err.textContent = '';
    if (p1.length < 8) { err.textContent = 'Password must be at least 8 characters.'; return; }
    if (p1 !== p2) { err.textContent = 'Passwords do not match.'; return; }
    btn.disabled = true; btn.textContent = 'Saving…';
    sbFresh().then(function(){
      return fetch(SUPABASE_URL + '/auth/v1/user', { method: 'PUT', headers: authHeaders(), body: JSON.stringify({ password: p1 }) });
    }).then(function(r){
      if (!r.ok) return r.json().then(function(j){ throw new Error(j.msg || j.message || 'Password change failed'); });
      if (mode === 'first') return fetch(SUPABASE_URL + '/rest/v1/faculty_profiles?email=eq.' + encodeURIComponent(PROFESSOR.email), { method: 'PATCH', headers: authHeaders(), body: JSON.stringify({ must_change_password: false }) })
        .then(function(pr){ if (!pr.ok) throw new Error('Profile update failed: ' + pr.status); });
    }).then(function(){ $('pw-wall').hidden = true; btn.disabled = false; toast('Password saved'); })
      .catch(function(ex){ err.textContent = ex.message; btn.disabled = false; btn.textContent = mode === 'first' ? 'Set password & continue' : 'Update password'; });
  });
  function signOut(){ sbUser = null; PROFESSOR = null; clearSession(); location.hash = '#home'; loadPublic().then(render); }

  // Start: restore a saved session, else show whatever needs no sign-in
  var saved = newestSession();
  if (saved && saved.access_token) {
    sbUser = saved; saveSession();
    sbFresh().then(function(ok){ if (ok) return enterApp(''); sbUser = null; clearSession(); render(); });
  } else loadPublic().then(render);
})();
</script>
</body>
</html>
