<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ergon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Sans+KR:wght@300;400;500;700&display=swap">
<style>
/* Ergon for faculty. Home lists the showrooms (a carousel of what is live, then every showroom and studio).
   Every showroom, booth and piece uses one template: a poster in the showroom colour with a stage, tiles of what is inside, facts.
   A piece is the leaf, so its poster folds into a thin band and the piece itself fills the width. */
:root{
  --bg:#FFFFFF; --fg:#111111; --muted:#5E6068; --line:#E4E4E8; --tile:#F2F2EF; --warn:#8A3A0A;
  --tone:#16233F; --tone-fg:#FFFFFF; --tone-soft:rgba(255,255,255,.76); --stage:#F2C14E; --accent:#C9874A;
  --sans:"Inter","Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111215; --fg:#ECECEE; --muted:#A4A6AE; --line:#2B2D33; --tile:#1C1D21; --warn:#F0A27A; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111215; --fg:#ECECEE; --muted:#A4A6AE; --line:#2B2D33; --tile:#1C1D21; --warn:#F0A27A; color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.55}
img{max-width:100%}
a{color:inherit}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1360px;margin:0 auto}
header.top{border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:28px;padding-block:14px;min-height:44px}
.brand{font-weight:600;font-size:17px;text-decoration:none}
.hostname{font-size:15px;text-decoration:none}
.hostname b{font-weight:600}
header nav{margin-left:auto;display:flex;gap:24px;font-size:14px}
header nav a{text-decoration:none}
header nav a[aria-current="page"]{border-bottom:1px solid var(--fg)}
.signin{margin-left:auto;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.me{position:relative}
.me>button{width:36px;height:36px;border-radius:50%;border:none;background:var(--tile);font-size:13px;font-weight:600}
.menu{position:absolute;right:0;top:44px;z-index:20;min-width:220px;padding:8px 0;background:var(--bg);box-shadow:0 0 0 1px var(--line),0 8px 24px rgba(0,0,0,.12)}
.menu .who{padding:8px 16px 10px;border-bottom:1px solid var(--line);font-size:14px}
.menu .who small{display:block;color:var(--muted)}
.menu button{display:block;width:100%;min-height:40px;padding:0 16px;border:none;background:transparent;text-align:left;font-size:14px}
.menu button:hover{background:var(--tile)}
.lbl{font-size:12px;letter-spacing:.04em;color:var(--muted)}
h1{margin:0;font-weight:300;letter-spacing:-.02em;line-height:1.08;text-wrap:balance}
h2{margin:0;font-weight:500;font-size:15px}
.chip{display:inline-block;padding:3px 9px;font-size:12px;font-weight:600;color:#111111}
/* sign-in (same flow as TaeSylla and Telos) */
.wall{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:var(--bg)}
.wall[hidden]{display:none}
.wcard{width:100%;max-width:420px;margin:0 16px;box-shadow:0 0 0 1px var(--line)}
.wcard .wh{padding:32px 32px 20px;border-bottom:1px solid var(--line)}
.wcard .wh .brand{display:block;margin-bottom:18px}
.wcard .wh h2{font-weight:300;font-size:28px;letter-spacing:-.01em}
.wcard .wh p{margin:6px 0 0;color:var(--muted)}
.wcard form{padding:24px 32px 32px;display:flex;flex-direction:column;gap:14px}
.wcard label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.wcard input{min-height:46px;padding:0 12px;border:1px solid var(--line);background:var(--bg);font-size:16px}
.wcard .err{min-height:20px;font-size:14px;color:var(--warn)}
.wcard button[type=submit]{min-height:46px;border:none;background:var(--fg);color:var(--bg);font-size:15px;font-weight:500}
.wcard button[type=submit]:disabled{opacity:.6;cursor:default}
.wcard .alt{font-size:13px;color:var(--muted)}
/* home: the carousel of live showrooms */
.deck{position:relative;height:clamp(440px,58vw,600px);margin-top:28px;overflow:hidden}
.card{position:absolute;top:0;bottom:0;left:50%;width:min(1120px,80vw);margin-left:calc(min(1120px,80vw) / -2);display:flex;flex-wrap:wrap;color:#FFFFFF;transition:transform 600ms cubic-bezier(.2,.7,.2,1),filter 600ms ease;overflow:hidden}
.card .ci{flex:1 1 300px;min-width:0;padding:36px;box-sizing:border-box;display:flex;flex-direction:column}
.card .cs{flex:1 1 380px;min-width:0;padding:36px 36px 36px 0;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;gap:12px}
.card .ctx{margin-top:24px;font-size:15px;font-weight:500;opacity:.9}
.card h1{margin-top:8px;font-size:clamp(28px,3.4vw,48px)}
.card .meta{margin-top:14px;opacity:.85}
.card .enter{margin-top:auto;align-self:flex-start;padding:24px 0 3px;border-bottom:1px solid #FFFFFF;text-decoration:none;font-size:15px}
.card .side{position:absolute;inset:0;border:none;background:transparent;padding:0}
.card .sidel{position:absolute;top:28px;max-width:30%;font-size:18px;pointer-events:none}
.dots{display:flex;justify-content:center;gap:4px;padding-top:12px}
.dots button{width:36px;height:32px;border:none;background:transparent;padding:0;display:flex;align-items:center}
.dots span{display:block;width:100%;height:2px;background:var(--line)}
.dots button[aria-current="true"] span{background:var(--fg)}
@media (max-width:700px){.card .cs{padding:0 24px 24px}.card .ci{padding:24px}}
/* poster */
.poster{background:var(--tone);color:var(--tone-fg)}
.poster .wrap{padding-block:12px 44px}
.crumb{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;min-height:44px;font-size:14px;color:var(--tone-soft)}
.crumb .path{display:flex;flex-wrap:wrap;align-items:center;gap:0 8px;min-width:0}
.crumb .path a{display:inline-flex;align-items:center;gap:6px;min-height:44px;text-decoration:none;color:var(--tone-fg)}
.crumb .path .sep{opacity:.6}
.crumb .sib{margin-left:auto;display:flex;align-items:center;gap:6px}
.crumb .sib a{display:inline-flex;align-items:center;min-height:44px;padding:0 6px;text-decoration:none;color:var(--tone-fg)}
.pgrid{display:flex;flex-wrap:wrap;align-items:center;gap:32px 56px;margin-top:14px}
.id{flex:1 1 340px;min-width:0;display:flex;flex-direction:column}
.state{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--tone-soft)}
.id .ctx{margin-top:24px;font-size:clamp(15px,1.3vw,19px);font-weight:500;line-height:1.35}
.id h1{margin-top:8px;font-size:clamp(32px,3.8vw,56px)}
.prog{margin-top:14px;color:var(--tone-soft);max-width:56ch}
.idl{margin:22px 0 0;display:grid;grid-template-columns:84px 1fr;gap:6px 14px;font-size:14px}
.idl dt{color:var(--tone-soft)} .idl dd{margin:0}
.stage{flex:1 1 520px;max-width:720px;min-width:0}
.shot{display:block;position:relative;width:100%;aspect-ratio:16/9;background:rgba(0,0,0,.25);overflow:hidden;text-decoration:none}
.shot img{display:block;width:100%;height:100%;object-fit:cover;animation:fade 600ms ease}
.ph{display:flex;flex-direction:column;justify-content:flex-end;gap:6px;width:100%;height:100%;box-sizing:border-box;padding:7%;background:rgba(255,255,255,.08);color:#FFFFFF;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.ph small{font-size:.8em;opacity:.8;letter-spacing:.04em}
.ph b{font-weight:300;font-size:1.5em;line-height:1.15}
.cap{display:flex;justify-content:space-between;gap:12px;margin-top:12px;font-size:14px}
.cap b{font-weight:600}
.cap span:last-child{opacity:.75;font-variant-numeric:tabular-nums}
.play{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center}
.sess{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));column-gap:20px;margin-top:36px;border-top:1px solid rgba(255,255,255,.28)}
.sess div{padding:12px 8px 0 0;margin-top:-1px;border-top:2px solid transparent;font-size:14px;color:var(--tone-soft)}
.sess div.on{border-top-color:#FFFFFF;color:#FFFFFF;font-weight:600}
.sess small{display:block;font-weight:400;font-size:12px;opacity:.85}
@keyframes fade{from{opacity:0}to{opacity:1}}
/* piece: a thin band and the piece across the full width */
.band .wrap{padding-block:4px 16px}
.brow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px}
.brow .bt{min-width:0;flex:1 1 320px;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 12px}
.brow .ctx{font-size:14px;font-weight:500;color:var(--tone-soft)}
.brow h1{font-size:clamp(20px,2.1vw,28px)}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.acts a{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;text-decoration:none;font-size:14px}
.acts a.go{background:#FFFFFF;color:#111111;font-weight:600}
.acts a.src{color:var(--tone-fg);text-decoration:underline;text-underline-offset:3px;padding:0 4px}
.full{background:#0B1220}
.full iframe{display:block;width:100%;max-width:calc((100vh - 140px) * 16 / 9);aspect-ratio:16/9;margin:0 auto;border:0;background:#0B1220}
/* tiles and facts */
.sec{padding-block:56px 0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-bottom:12px;margin-bottom:24px;border-bottom:1px solid var(--fg)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:40px 28px}
.tiles.wide{grid-template-columns:repeat(auto-fill,minmax(360px,1fr))}
.tile{display:block;text-decoration:none}
.tile .minis{display:flex;gap:8px;padding:14px;background:var(--tile)}
.tile .minis img,.tile .minis .ph{flex:1;min-width:0;aspect-ratio:16/9;object-fit:cover;font-size:7px;background:var(--tile);color:var(--muted);box-shadow:0 0 0 1px var(--line);height:auto}
.tile .one{position:relative;display:block;background:var(--tile);padding:14px}
.tile .one img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;box-shadow:0 0 0 1px var(--line)}
.tile .one .play{width:44px;height:44px;margin:-22px 0 0 -22px}
.tile .row{display:flex;justify-content:space-between;gap:8px;margin-top:12px;font-size:12px;color:var(--muted)}
.tile .t{display:block;margin-top:4px;font-size:17px;font-weight:500;line-height:1.3}
.tile .s{display:block;margin-top:6px;font-size:13px;color:var(--muted)}
a.tile:hover .t{text-decoration:underline;text-underline-offset:3px}
.rtile{display:flex;flex-direction:column;aspect-ratio:16/9;padding:22px;box-sizing:border-box;color:#FFFFFF;text-decoration:none}
.rtile .rs{margin-top:auto;font-size:13px;opacity:.85}
.rtile .rn{margin-top:6px;font-weight:300;font-size:26px;line-height:1.1;letter-spacing:-.01em}
.rtile .rm{margin-top:10px;font-size:13px;opacity:.9}
.newtile{display:flex;align-items:center;justify-content:center;aspect-ratio:16/9;box-shadow:inset 0 0 0 1px var(--line);font-weight:300;font-size:32px;color:var(--muted)}
.empty{padding:28px 0;color:var(--muted)}
.group{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:28px 0 16px}
.group b{font-size:18px;font-weight:500}
.facts{display:grid;grid-template-columns:minmax(110px,190px) 1fr;gap:14px 24px;max-width:900px;margin:0}
.facts dt{color:var(--muted)} .facts dd{margin:0}
@media (max-width:640px){.facts{grid-template-columns:1fr;gap:2px}.facts dd{margin-bottom:12px}}
.foot{padding-block:48px 72px;color:var(--muted);font-size:13px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;padding:10px 16px;background:var(--fg);color:var(--bg);font-size:14px}
.toast[hidden]{display:none}
@media (prefers-reduced-motion: reduce){.shot img{animation:none}.card{transition:none}}
</style>
</head>

<main id="app"></main>

<!-- SIGN-IN (same as TaeSylla and Telos: Taejae faculty email and password, shared Supabase project) -->
<div class="wall" id="login-wall" hidden>

    <div class="wh"><span class="brand">Ergon</span><h2>Sign in</h2><p>Use your Taejae faculty email to sign in</p></div>
    <form id="login-form" novalidate>
      <label for="wall-email">Email<input id="wall-email" type="email" autocomplete="username" placeholder="your@taejae.ac.kr" required></label>
      <label for="wall-password">Password<input id="wall-password" type="password" autocomplete="current-password" required></label>
      <div class="err" id="wall-error" role="alert"></div>
      <button type="submit" id="wall-submit">Sign in</button>
      <div class="alt" id="wall-alt"></div>
    </form>
  </div>
</div>
<div class="wall" id="pw-wall" hidden>
  <div class="wcard">
    <div class="wh"><span class="brand">Ergon</span><h2 id="pw-title">Set your password</h2><p id="pw-desc">This is your first sign-in. Please set a new password to continue.</p></div>
    <form id="pw-form" novalidate>
      <label for="pw-new">New password<input id="pw-new" type="password" autocomplete="new-password" placeholder="At least 8 characters" required></label>
      <label for="pw-confirm">Confirm password<input id="pw-confirm" type="password" autocomplete="new-password" required></label>
      <div class="err" id="pw-error" role="alert"></div>
      <button type="submit" id="pw-submit">Set password &amp; continue</button>
    </form>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

  }
  $('login-form').addEventListener('submit', function(e){
    e.preventDefault();
    var email = $('wall-email').value.trim(), password = $('wall-password').value, err = $('wall-error'), btn = $('wall-submit');
    if (loginLocked) return;
    if (!email || !password) { err.textContent = 'Email and password are required.'; return; }
    if (!/@taejae\.ac\.kr$/i.test(email)) { err.textContent = 'Please use your @taejae.ac.kr institutional email.'; return; }
    btn.textContent = 'Signing in…'; btn.disabled = true; err.textContent = '';
    fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', { method: 'POST', headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ email: email, password: password }) })
      .then(function(r){ return r.json().then(function(data){ if (!r.ok) throw new Error(data.error_description || data.msg || 'Sign-in failed'); return data; }); })
      .then(function(data){ sbUser = data; saveSession(); loginAttempts = 0; $('wall-password').value = ''; btn.textContent = 'Sign in'; btn.disabled = false; return enterApp(email); })
      .catch(function(ex){
        loginAttempts++;
        if (loginAttempts >= 5) {
          loginLocked = true; err.textContent = 'Too many failed attempts. Please wait 30 seconds.'; btn.disabled = true;
          setTimeout(function(){ loginAttempts = 0; loginLocked = false; btn.disabled = false; btn.textContent = 'Sign in'; err.textContent = ''; }, 30000);
        } else { err.textContent = ex.message; btn.textContent = 'Sign in'; btn.disabled = false; }
      });
  });
  function showPwWall(mode){
    $('pw-wall').dataset.mode = mode;
    $('pw-title').textContent = mode === 'first' ? 'Set your password' : 'Change password';
    $('pw-desc').textContent = mode === 'first' ? 'This is your first sign-in. Please set a new password to continue.' : 'Enter your new password below.';
    $('pw-submit').textContent = mode === 'first' ? 'Set password & continue' : 'Update password';
    $('pw-new').value = ''; $('pw-confirm').value = ''; $('pw-error').textContent = '';
    $('pw-wall').hidden = false; $('pw-new').focus();
  }
  $('pw-form').addEventListener('submit', function(e){
    e.preventDefault();
    var p1 = $('pw-new').value, p2 = $('pw-confirm').value, err = $('pw-error'), btn = $('pw-submit'), mode = $('pw-wall').dataset.mode;
    err.textContent = '';
    if (p1.length < 8) { err.textContent = 'Password must be at least 8 characters.'; return; }
    if (p1 !== p2) { err.textContent = 'Passwords do not match.'; return; }
    btn.disabled = true; btn.textContent = 'Saving…';
    sbFresh().then(function(){
      return fetch(SUPABASE_URL + '/auth/v1/user', { method: 'PUT', headers: authHeaders(), body: JSON.stringify({ password: p1 }) });
    }).then(function(r){
      if (!r.ok) return r.json().then(function(j){ throw new Error(j.msg || j.message || 'Password change failed'); });
      if (mode === 'first') return fetch(SUPABASE_URL + '/rest/v1/faculty_profiles?email=eq.' + encodeURIComponent(PROFESSOR.email), { method: 'PATCH', headers: authHeaders(), body: JSON.stringify({ must_change_password: false }) })
        .then(function(pr){ if (!pr.ok) throw new Error('Profile update failed: ' + pr.status); });
    }).then(function(){ $('pw-wall').hidden = true; btn.disabled = false; toast('Password saved'); })
      .catch(function(ex){ err.textContent = ex.message; btn.disabled = false; btn.textContent = mode === 'first' ? 'Set password & continue' : 'Update password'; });
  });
  function signOut(){ sbUser = null; PROFESSOR = null; clearSession(); location.hash = '#home'; render(); }

  // Start: restore a saved session, else show whatever needs no sign-in
  var saved = null;
  try { saved = JSON.parse(sessionStorage.getItem(SESSION_KEY) || 'null'); } catch (e) { saved = null; }
  if (saved && saved.access_token) {
    sbUser = saved;
    sbFresh().then(function(ok){ if (ok) return enterApp(''); sbUser = null; clearSession(); render(); });
  } else render();
})();
</script>
</body>
</html>
