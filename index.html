<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>뇌과학 아카데미 특강</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Sans+KR:wght@300;400;500;700&display=swap">
<style id="css">
/* Layout: one Ergon page template, taken from the showroom page — a poster in the showroom colour (who/what/when on the left, a stage on the right), tiles of what is inside, then the facts. Showroom, booth and piece all use it. */
:root{
  --bg:#FFFFFF; --fg:#111111; --muted:#5E6068; --line:#E4E4E8; --tile:#F2F2EF; --warn:#8A3A0A;
  --tone:#16233F; --tone-fg:#FFFFFF; --tone-soft:rgba(255,255,255,.74); --stage:#F2C14E; --accent:#C9874A;
  --sans:"Inter","Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111215; --fg:#ECECEE; --muted:#A4A6AE; --line:#2B2D33; --tile:#1C1D21; --warn:#F0A27A; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111215; --fg:#ECECEE; --muted:#A4A6AE; --line:#2B2D33; --tile:#1C1D21; --warn:#F0A27A; color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.55}
img{max-width:100%}
a{color:inherit}
button,input,select{font-family:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,[contenteditable]:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1360px;margin:0 auto}
header.top{border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:28px;padding-block:18px;min-height:28px}
.brand{font-weight:600;font-size:17px;text-decoration:none}
.host{font-size:15px}
.host b{font-weight:600}
header nav{margin-left:auto;display:flex;gap:24px;font-size:14px}
header nav a{text-decoration:none}
header nav a[aria-current]{border-bottom:1px solid var(--fg)}
.who{font-size:14px;color:var(--muted)}
.lbl{font-size:12px;letter-spacing:.04em;color:var(--muted)}
h1{margin:0;font-weight:300;letter-spacing:-.02em;line-height:1.08;text-wrap:balance}
h2{margin:0;font-weight:500;font-size:15px}
/* poster */
.poster{background:var(--tone);color:var(--tone-fg)}
.poster .wrap{padding-block:18px 44px}
.crumb{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;min-height:44px;font-size:14px;color:var(--tone-soft)}
.crumb a{display:inline-flex;align-items:center;gap:8px;min-height:44px;text-decoration:none;color:var(--tone-fg)}
.crumb .path{display:flex;flex-wrap:wrap;align-items:center;gap:0 8px;min-width:0}
.crumb .path .sep{opacity:.6}
.crumb .path .here{color:var(--tone-soft)}
.crumb .sib{margin-left:auto;display:flex;align-items:center;gap:6px}
.crumb .sib a{padding:0 6px}
.crumb .sib span{font-variant-numeric:tabular-nums}
.ebtn{min-height:36px;padding:0 14px;border:1px solid rgba(255,255,255,.6);background:transparent;color:var(--tone-fg);font-size:13px}
.ebtn.solid{background:#FFFFFF;color:#111111;border-color:#FFFFFF;font-weight:600}
.etools{display:flex;align-items:center;gap:8px;margin-left:12px}
.emsg{font-size:13px;color:var(--tone-soft)}
.pgrid{display:flex;flex-wrap:wrap;align-items:center;gap:32px 56px;margin-top:18px}
.id{flex:1 1 340px;min-width:0;display:flex;flex-direction:column}
.state{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--tone-soft)}
.chip{display:inline-block;padding:3px 9px;font-size:12px;font-weight:600;color:#111111}
.ctx{margin-top:24px;font-size:clamp(15px,1.3vw,19px);font-weight:500;line-height:1.35}
.id h1{margin-top:8px;font-size:clamp(32px,3.8vw,56px)}
.prog{margin-top:14px;color:var(--tone-soft);max-width:56ch}
[contenteditable="true"]{outline:1px dashed rgba(255,255,255,.55);outline-offset:4px;cursor:text}
.idl{margin:22px 0 0;display:grid;grid-template-columns:84px 1fr;gap:6px 14px;font-size:14px}
.idl dt{color:var(--tone-soft)} .idl dd{margin:0}
.stage{flex:1 1 520px;max-width:720px;min-width:0}
.shot{display:block;position:relative;width:100%;aspect-ratio:16/9;background:#0B1220;overflow:hidden;text-decoration:none}
.shot img{display:block;width:100%;height:100%;object-fit:cover;animation:fade 600ms ease}
.ph{display:flex;flex-direction:column;justify-content:flex-end;gap:6px;width:100%;height:100%;box-sizing:border-box;padding:7%;background:#22324F;color:#FFFFFF}
.ph small{font-size:.8em;opacity:.75;letter-spacing:.04em}
.ph b{font-weight:300;font-size:1.6em;line-height:1.15}
.cap{display:flex;justify-content:space-between;gap:12px;margin-top:12px;font-size:14px}
.cap b{font-weight:600}
.cap span:last-child{color:var(--tone-soft);font-variant-numeric:tabular-nums}
.play{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center}
.pbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;min-height:52px;padding:0 14px;background:#0B1220;font-size:14px}
.pbar a{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;background:#FFFFFF;color:#111111;text-decoration:none;font-weight:600}
.pbar .note{color:var(--tone-soft)}
.sess{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));column-gap:20px;margin-top:36px;border-top:1px solid rgba(255,255,255,.28)}
.sess div{padding:12px 8px 0 0;margin-top:-1px;border-top:2px solid #FFFFFF;font-weight:600;font-size:14px}
.sess small{display:block;font-weight:400;color:var(--tone-soft);font-size:12px}
@keyframes fade{from{opacity:0}to{opacity:1}}
/* tiles and facts */
.sec{padding-block:56px 0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-bottom:12px;margin-bottom:24px;border-bottom:1px solid var(--fg)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:40px 28px}
.tbox.off .tile{opacity:.45}
.tile{display:block;text-decoration:none}
.tile .minis{display:flex;gap:8px;padding:14px;background:var(--tile)}
.tile .minis img,.tile .minis .ph{flex:1;min-width:0;aspect-ratio:16/9;object-fit:cover;box-shadow:0 0 0 1px var(--line);font-size:7px}
.tile .one{position:relative;display:block;background:var(--tile);padding:14px}
.tile .one img,.tile .one .ph{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;box-shadow:0 0 0 1px var(--line);font-size:11px;height:auto}
.tile .one .play{width:44px;height:44px;margin:-22px 0 0 -22px}
.tile .row{display:flex;justify-content:space-between;gap:8px;margin-top:12px;font-size:12px;color:var(--muted)}
.tile .t{display:block;margin-top:4px;font-size:17px;font-weight:500;line-height:1.3}
.tile .s{display:block;margin-top:6px;font-size:13px;color:var(--muted)}
.tile:hover .t{text-decoration:underline;text-underline-offset:3px}
.tctl{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px}
.tctl button{min-height:34px;padding:0 10px;border:1px solid var(--line);background:var(--bg);font-size:13px}
.tctl .hid{color:var(--warn);font-size:13px;margin-left:4px}
.add{border:1px dashed var(--muted);padding:16px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.add label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.add input,.add select{min-height:40px;padding:0 10px;border:1px solid var(--line);background:var(--bg);font-size:14px;color:var(--fg)}
.add button{align-self:flex-start;min-height:40px;padding:0 16px;border:none;background:var(--fg);color:var(--bg);font-weight:500}
.facts{display:grid;grid-template-columns:minmax(110px,190px) 1fr;gap:14px 24px;max-width:900px;margin:0}
.facts dt{color:var(--muted)} .facts dd{margin:0}
@media (max-width:640px){.facts{grid-template-columns:1fr;gap:2px}.facts dd{margin-bottom:12px}}
.foot{padding-block:48px 72px;color:var(--muted);font-size:13px}
/* piece (leaf): the poster shrinks to a band and the piece fills the browser width */
.band .wrap{padding-block:4px 16px}
.brow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px}
.brow .state{flex:none}
.brow .bt{min-width:0;flex:1 1 320px;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 12px}
.brow .ctx{margin:0;font-size:14px;font-weight:500;color:var(--tone-soft)}
.brow h1{margin:0;font-size:clamp(20px,2.1vw,28px)}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.acts a{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;text-decoration:none;font-size:14px}
.acts a.go{background:#FFFFFF;color:#111111;font-weight:600}
.acts a.src{color:var(--tone-fg);text-decoration:underline;text-underline-offset:3px;padding:0 4px}
.full{background:#0B1220}
.full a{display:block;position:relative;margin:0 auto;max-width:calc((100vh - 140px) * 16 / 9)}
.full img,.full .ph{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;height:auto;font-size:clamp(14px,1.6vw,22px)}
.full iframe{display:block;width:100%;max-width:calc((100vh - 140px) * 16 / 9);aspect-ratio:16/9;margin:0 auto;border:0;background:#0B1220}
.full .play{width:88px;height:88px;margin:-44px 0 0 -44px}
@media (prefers-reduced-motion: reduce){.shot img{animation:none}}
</style>
</head>
<body>

      '<div class="brow"><div class="state"><span class="chip" style="background:' + chipBg(cfg.state) + '">' + cfg.state + '</span><span>' + esc(cfg.when) + '</span></div>' +
      '<div class="bt"><span class="ctx"' + ce('ctx') + '>' + esc(cfg.ctx) + '</span><h1' + ce('name') + '>' + esc(cfg.name) + '</h1></div>' +
      '<div class="acts"><a class="go" href="' + esc(OPEN(p)) + '" target="_blank" rel="noopener">' + go + '</a><a class="src" href="' + esc(SOURCE(p)) + '" target="_blank" rel="noopener">' + (p.type === 'slides' ? 'Google Slides ↗' : 'Original ↗') + '</a></div></div>' +
      '</div></section>' +
      '<div class="full">' + (EMBED(p) ? '<iframe src="' + esc(EMBED(p)) + '" title="' + esc(p.name) + '" allow="autoplay; fullscreen" allowfullscreen loading="lazy"></iframe>' : '<a href="' + esc(OPEN(p)) + '" target="_blank" rel="noopener" aria-label="Open ' + esc(p.name) + '">' + visual(p) + (p.type === 'video' ? playIcon : '') + '</a>') + '</div>';
    return h + lower(cfg);
  }

  function page(cfg){
    if (cfg.piece) return leaf(cfg);
    var ed = ui.editing, h = '<section class="poster gut" aria-label="' + esc(cfg.name) + '"><div class="wrap">' + crumbHTML(cfg).replace(/<\/div>$/, '');
    var ce = function(field){ return ed && cfg.key ? ' contenteditable="true" data-key="' + cfg.key + '" data-field="' + field + '" spellcheck="false"' : ''; };
    h += '</div><div class="pgrid"><div class="id">' +
      '<div class="state"><span class="chip" style="background:' + chipBg(cfg.state) + '">' + cfg.state + '</span><span>' + esc(cfg.when) + '</span></div>' +
      '<div class="ctx"' + ce('ctx') + '>' + esc(cfg.ctx) + '</div><h1' + ce('name') + '>' + esc(cfg.name) + '</h1><div class="prog"' + ce('prog') + '>' + esc(cfg.prog) + '</div>';
    if (cfg.dl) h += '<dl class="idl">' + cfg.dl.map(function(x){ return '<dt>' + esc(x[0]) + '</dt><dd>' + esc(x[1]) + '</dd>'; }).join('') + '</dl>';
    h += '</div><div class="stage" id="stage">' + stageHTML(cfg) + '</div></div>';
    if (cfg.sessions && cfg.sessions.length > 1) h += '<div class="sess" role="group" aria-label="Sessions">' + cfg.sessions.map(function(x){ return '<div>' + esc(x[0]) + '<small>' + esc(x[1]) + '</small></div>'; }).join('') + '</div>';
    h += '</div></section><div class="gut"><div class="wrap">';
    var tiles = cfg.tiles || [];
    if (tiles.length || (ed && cfg.addForm)) h += '<section class="sec" aria-labelledby="t-h"><div class="sec-h"><h2 id="t-h">' + esc(cfg.tilesTitle) + '</h2></div><div class="tiles">' + tiles.join('') + (ed && cfg.addForm ? cfg.addForm : '') + '</div></section>';
    if (cfg.facts) h += '<section class="sec" aria-labelledby="f-h"><div class="sec-h"><h2 id="f-h">' + esc(cfg.factsTitle) + '</h2></div><dl class="facts">' + cfg.facts.map(function(x){ return '<dt>' + esc(x[0]) + '</dt><dd>' + esc(x[1]) + '</dd>'; }).join('') + '</dl></section>';
    h += '</div></div><div class="foot gut"><div class="wrap">' + (ui.member ? 'Ergon · Taejae University' : 'Taejae University · shown with Ergon') + '</div></div>';
    return h;
  }

  // The stage: a rotating show of what is inside, or, on a piece page, the piece itself with its player
  function stageHTML(cfg){
    if (cfg.piece) {
      var p = cfg.piece, bar;
      if (p.type === 'video') bar = '<a href="' + esc(OPEN(p)) + '" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" width="16" height="16" fill="#111111" aria-hidden="true"><path d="M8 5l11 7-11 7z"/></svg>Play</a><span class="note">opens in a new tab</span>';
      else if (p.type === 'slides') bar = '<a href="' + esc(OPEN(p)) + '" target="_blank" rel="noopener">Present as a slideshow</a><span class="note">opens in Google Slides</span>';
      else bar = '<a href="' + esc(OPEN(p)) + '" target="_blank" rel="noopener">Open</a><span class="note">opens in a new tab</span>';
      return '<a class="shot" href="' + esc(OPEN(p)) + '" target="_blank" rel="noopener" aria-label="Open ' + esc(p.name) + '">' + visual(p) + (p.type === 'video' ? playIcon : '') + '</a>' +
        '<div class="pbar">' + bar + '</div>' +
        '<div class="cap"><span><b>' + esc(p.part) + '</b> · ' + esc(p.src) + '</span><span><a href="' + esc(SOURCE(p)) + '" target="_blank" rel="noopener" style="color:var(--tone-fg);text-underline-offset:3px">' + (p.type === 'slides' ? 'Open in Google Slides ↗' : 'Open the original ↗') + '</a></span></div>';
    }
    var s = cfg.stage;
    if (!s.length) return '<span class="shot"><span class="ph"><small>Nothing on show yet</small><b>' + esc(cfg.name) + '</b></span></span>';
    var n = s.length, k = rot % n, it = s[k];
    return '<a class="shot" href="#' + it.href + '" aria-label="Open ' + esc(it.title) + '">' + visual(it.p) + (it.p.type === 'video' ? playIcon : '') + '</a>' +
      '<div class="cap"><span><b>' + esc(it.title) + '</b> · ' + esc(it.sub) + '</span><span>' + (k + 1) + ' / ' + n + '</span></div>';
  }

  function tileWrap(key, parentKey, inner, hidden){
    if (!ui.editing) return inner;
    return '<div class="tbox' + (hidden ? ' off' : '') + '">' + inner + '<div class="tctl"><button type="button" data-act="move" data-key="' + key + '" data-parent="' + parentKey + '" data-dir="-1" aria-label="Move earlier">←</button><button type="button" data-act="move" data-key="' + key + '" data-parent="' + parentKey + '" data-dir="1" aria-label="Move later">→</button><button type="button" data-act="hide" data-key="' + key + '">' + (hidden ? 'Show' : 'Hide') + '</button>' + (hidden ? '<span class="hid">Hidden from visitors</span>' : '') + '</div></div>';
  }
  function pieceTile(p, b){
    return tileWrap(p.key, b.key, '<a class="tile" href="#' + p.key + '"><span class="one">' + visual(p) + (p.type === 'video' ? playIcon : '') + '</span>' +
      '<span class="row"><span>' + esc(p.part) + '</span><span>' + esc(typeName(p.type)) + '</span></span><span class="t">' + esc(p.name) + '</span><span class="s">' + esc(p.src) + '</span></a>', p.hidden);
  }
  var stageOf = function(p, b){ return { title: p.name, sub: (b ? b.label + ' · ' : '') + p.part, p: p, href: p.key }; };
  var addPieceForm = function(bk){ return '<form class="add" data-form="piece" data-booth="' + bk + '"><b style="font-weight:600">Add a piece</b>' +
    '<label for="ap-link">Link (Google Slides, Drive, YouTube …)<input id="ap-link" name="link" type="url" required placeholder="https://"></label>' +
    '<label for="ap-name">Title<input id="ap-name" name="name" required></label>' +
    '<label for="ap-part">Label<input id="ap-part" name="part" placeholder="Lesson 4 · video"></label>' +
    '<label for="ap-type">Type<select id="ap-type" name="type"><option value="auto">Detect from the link</option><option value="video">Video</option><option value="slides">Slides</option><option value="link">Other link</option></select></label>' +
    '<button type="submit">Add piece</button></form>'; };
  var addBoothForm = '<form class="add" data-form="booth"><b style="font-weight:600">Add a booth</b>' +
    '<label for="ab-label">Label<input id="ab-label" name="label" required placeholder="Week 3"></label>' +
    '<label for="ab-name">Title<input id="ab-name" name="name" required></label>' +
    '<label for="ab-when">When<input id="ab-when" name="when" placeholder="Nov 9–13"></label>' +
    '<button type="submit">Add booth</button></form>';

  function showroomCfg(){
    var R = M.room, st = stateOf(R.from, R.to), stage = [];
    M.booths.forEach(function(b){ if (!b.hidden) b.pieces.forEach(function(p){ if (!p.hidden) stage.push(stageOf(p, b)); }); });
    return { key: 'showroom', crumb: { path: [[R.name, null]] }, state: st, when: R.when, ctx: R.ctx, name: R.name,
      prog: R.prog || (st === 'On stage' ? 'Lessons open · participants and parents invited' : st === 'Past' ? 'Recordings and slides stay open' : 'Opens Oct 26'),
      dl: [['Host', '곽지영 교수'], ['Booths', plural(M.booths.filter(function(b){ return !b.hidden; }).length, 'booth')]], stage: stage, sessions: [['특강 기간', R.when]],
      tilesTitle: 'Booths', addForm: addBoothForm, tiles: M.booths.map(function(b){
        var s = stateOf(b.from, b.to), vis = b.pieces.filter(function(p){ return !p.hidden; });
        return tileWrap(b.key, 'showroom', '<a class="tile" href="#' + b.key + '"><span class="minis">' + (vis.length ? vis.slice(0, 3).map(visual).join('') : '<span class="ph"><small>Empty</small><b>' + esc(b.name) + '</b></span>') + '</span>' +
          '<span class="row"><span>' + esc(b.label) + ' · ' + esc(b.when) + '</span><span>' + plural(vis.length, 'piece') + '</span></span><span class="t">' + esc(b.name) + '</span>' +
          '<span class="s">' + (s === 'On stage' ? 'On stage now' : s === 'Past' ? 'Shown ' + esc(b.when) : 'Starts ' + esc(String(b.when).split('–')[0])) + '</span></a>', b.hidden);
      }),
      factsTitle: 'About this showroom',
      facts: [['What', '고교생 대상 뇌과학 아카데미의 Data Science & AI 특강. 뇌를 모방한 신경망에서 언어 모델까지, 두 주 동안 여섯 차시.'], ['Booths', 'One per week · lecture videos and slides'], ['Audience', 'Anyone with the link'], ['Pieces open in', 'Google Drive for videos · Google Slides for slide decks']] };
  }

  function boothCfg(key){
    var r = findBooth(key), b = r.b, nB = M.booths.length, i = Math.max(0, r.i);
    var crumb = { path: [[M.room.name, '#showroom'], [b.label + ' · ' + b.name, null]] };
    if (nB > 1) { var prev = M.booths[(i - 1 + nB) % nB], next = M.booths[(i + 1) % nB]; crumb.prev = [prev.key, prev.label]; crumb.next = [next.key, next.label]; crumb.pos = (i + 1) + ' / ' + nB; }
    return { key: b.key, crumb: crumb, state: stateOf(b.from, b.to), when: b.when, ctx: b.label, name: b.name, prog: b.prog || '',
      dl: [['Lecturer', '곽지영 교수'], ['Pieces', plural(b.pieces.filter(function(p){ return !p.hidden; }).length, 'piece')]],
      stage: b.pieces.filter(function(p){ return !p.hidden; }).map(function(p){ return stageOf(p); }), sessions: [['특강 기간', M.room.when]],
      tilesTitle: 'Pieces', addForm: addPieceForm(b.key), tiles: b.pieces.map(function(p){ return pieceTile(p, b); }),
      factsTitle: 'About this booth', facts: [['When', b.when], ['Showroom', M.room.name]] };
  }

  function pieceCfg(key){
    var r = findPiece(key), b = r.b, p = r.p, list = b.pieces, n = list.length, j = Math.max(0, list.indexOf(p));
    var crumb = n > 1
      ? { path: [[M.room.name, '#showroom'], [b.label + ' · ' + b.name, '#' + b.key], [String(p.part).split(' · ')[0], null]], prev: [list[(j - 1 + n) % n].key, String(list[(j - 1 + n) % n].part).split(' · ')[0]], next: [list[(j + 1) % n].key, String(list[(j + 1) % n].part).split(' · ')[0]], pos: (j + 1) + ' / ' + n }
      : { path: [[M.room.name, '#showroom'], [b.label + ' · ' + b.name, null]] };   // a single-piece booth opens straight on its piece, so the booth is this page
    return { key: p.key, crumb: crumb, state: stateOf(b.from, b.to), when: b.when, ctx: p.part, name: p.name, prog: p.src,
      dl: [['Lecturer', '곽지영 교수'], ['Booth', b.label + ' · ' + b.name]], piece: p, sessions: [['특강 기간', M.room.when]],
      tilesTitle: 'Also in ' + b.label, tiles: n > 1 ? list.filter(function(x){ return x !== p; }).map(function(x){ return pieceTile(x, b); }) : [],
      addForm: n > 1 ? null : addPieceForm(b.key),
      factsTitle: 'About this piece', facts: [['Source', p.src], ['Booth', b.label + ' · ' + b.name], ['Lecturer', '곽지영 교수'], ['Opens in', p.type === 'slides' ? 'Google Slides, as a slideshow' : 'A new tab']] };
  }

  var app = document.getElementById('app');
  function render(keepScroll){
    M = model();
    var v = location.hash.slice(1), fb = findBooth(v), fp = findPiece(v);
    if (fb && fb.b.hidden && !ui.editing) fb = null;
    if (fp && (fp.p.hidden || fp.b.hidden) && !ui.editing) fp = null;
    current = fp ? pieceCfg(v) : fb ? (fb.b.pieces.length === 1 && !ui.editing ? pieceCfg(fb.b.pieces[0].key) : boothCfg(v)) : showroomCfg();
    rot = 0;
    header();
    var y = window.scrollY;
    app.innerHTML = page(current);
    window.scrollTo(0, keepScroll ? y : 0);
  }

  // Editing: only the host sees these controls; Save republishes the page with the new state for everyone
  function draft(){ var dft = ui.draft; dft.text = dft.text || {}; dft.hidden = dft.hidden || {}; dft.order = dft.order || {}; dft.addedPieces = dft.addedPieces || {}; dft.addedBooths = dft.addedBooths || []; return dft; }
  function detect(link){ return /docs\.google\.com\/presentation/.test(link) ? 'slides' : /youtu\.?be|vimeo\.com|\.mp4(\?|$)/.test(link) ? 'video' : 'link'; }
  function hostOf(link){ try { return new URL(link).hostname.replace(/^www\./, ''); } catch (e) { return 'Link'; } }
  function documentHTML(state){
    var css = document.getElementById('css').textContent, js = document.getElementById('app-js').textContent;
    return SKEL + '\n<title>뇌과학 아카데미 특강</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Sans+KR:wght@300;400;500;700&display=swap">\n<style id="css">' + css + '</style>\n<header class="top gut" id="top"></header>\n<main id="app"></main>\n<script type="application/json" id="state">' + JSON.stringify(state).replace(/</g, '\\u003c') + '</scr' + 'ipt>\n<script id="app-js">' + js + '</scr' + 'ipt>\n</body></html>';
  }
  app.addEventListener('input', function(e){
    var t = e.target; if (!ui.editing || !t.hasAttribute('data-key')) return;
    var dft = draft(), k = t.getAttribute('data-key'); dft.text[k] = dft.text[k] || {}; dft.text[k][t.getAttribute('data-field')] = t.textContent.trim();
  });
  app.addEventListener('submit', function(e){
    e.preventDefault(); var f = e.target, dft = draft(), fd = new FormData(f), id = Date.now().toString(36);
    if (f.getAttribute('data-form') === 'piece') {
      var link = String(fd.get('link') || '').trim(), type = fd.get('type') === 'auto' ? detect(link) : String(fd.get('type')), bk = f.getAttribute('data-booth');
      (dft.addedPieces[bk] = dft.addedPieces[bk] || []).push({ key: 'p' + id, type: type, name: String(fd.get('name')).trim(), part: String(fd.get('part') || '').trim() || typeName(type), src: (type === 'slides' ? 'Google Slides' : hostOf(link)), link: link });
    } else {
      dft.addedBooths.push({ key: 'b' + id, label: String(fd.get('label')).trim(), name: String(fd.get('name')).trim(), when: String(fd.get('when') || '').trim() || BASE_ROOM.when, prog: '', pieces: [] });
    }
    ui.msg = 'Added · press Save to publish'; render(true);
  });
  app.addEventListener('click', function(e){
    var t = e.target.closest('[data-act]'); if (!t) return;
    var act = t.getAttribute('data-act');
    if (act === 'edit') { ui.editing = true; ui.draft = clone(saved); ui.msg = ''; render(true); return; }
    if (act === 'cancel') { ui.editing = false; ui.draft = null; ui.msg = ''; render(true); return; }
    if (act === 'hide') { var dh = draft(), k = t.getAttribute('data-key'); if (dh.hidden[k]) delete dh.hidden[k]; else dh.hidden[k] = true; render(true); return; }
    if (act === 'move') {
      var dm = draft(), key = t.getAttribute('data-key'), parent = t.getAttribute('data-parent'), dir = +t.getAttribute('data-dir');
      var list = parent === 'showroom' ? M.all.map(function(b){ return b.key; }) : findBooth(parent).b.all.map(function(p){ return p.key; });
      var i = list.indexOf(key), j = i + dir; if (j < 0 || j >= list.length) return;
      list.splice(i, 1); list.splice(j, 0, key); dm.order[parent] = list; render(true); return;
    }
    if (act === 'save') {
      if (!ui.artifact) { ui.msg = 'Saving is not available in this view'; render(true); return; }
      ui.msg = 'Saving…'; render(true);
      ui.artifact.publish(documentHTML(ui.draft)).then(function(){ ui.msg = 'Saved'; }, function(err){
        var c = err && err.code; ui.msg = c === 'conflict' ? 'Someone else saved first · the page reloads with their version' : c === 'not_granted' || c === 'not_writer' ? 'You can view this page but not save it' : 'Could not save · try again';
        render(true);
      });
    }
  });
  window.addEventListener('hashchange', function(){ render(false); });
  setInterval(function(){
    var st = document.getElementById('stage');
    if (!current || current.piece || !st || document.hidden || st.contains(document.activeElement) || !current.stage.length) return;
    rot++; st.innerHTML = stageHTML(current);
  }, 4000);
  render(false);

  // Who is looking: members of the host's organization get the Ergon header; the host also gets Edit
  if (window.claude && window.claude.use) {
    window.claude.use('user').then(function(user){
      if (!user) return;
      return Promise.all([user.me(), user.canEdit()]).then(function(r){
        var me = r[0], can = r[1];
        if (!me || !me.id) { ui.canEdit = !!can; return; }
        return user.profiles(me.id).then(function(ps){ var pr = ps && ps[me.id]; ui.member = !(pr && pr.guest); ui.canEdit = !!can; });
      });
    }).then(function(){
      if (!ui.canEdit) { render(true); return; }
      return window.claude.use('artifact').then(function(a){ ui.artifact = a; render(true); });
    }).catch(function(){});
  }
})();
</script>

</body>
